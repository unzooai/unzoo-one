<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Unzoo One Open Gate mark</title>
  <desc id="desc">A rounded capability boundary opened by a number one shaped path.</desc>
  <defs>
    <linearGradient id="one-b-signal" x1="42" y1="222" x2="220" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6FF"/>
      <stop offset=".5" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#A06CFF"/>
    </linearGradient>
    <mask id="gate-cut">
      <rect width="256" height="256" fill="#fff"/>
      <path d="m98 113 52-44h29v121h-41v-69l-20 17z" fill="#000"/>
      <path d="M154 69h25l34-41h15v27l-49 50h-25z" fill="#000"/>
